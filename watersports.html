</main>

<div class="lang">EN &#8963;</div>
<a class="wa-float" id="waFloat" target="_blank" aria-label="WhatsApp">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
</a>

<script>
/* CHANGE THESE */
const WHATSAPP = "+255 679 542 803";      // your number, without +
const EMAIL = "rieutoursandsafaris@gmail.com";   // your email

const TOURS = {
  mnemba:{title:"Mnemba Half day trip",url:"mnemba.html",img:"images/mn-mba.jpg",date:"March 25, 2020",time:"Half day",from:"$45",
    short:"This tour takes you to Mnemba island, one of the most beautful beach in Zanzibar. You will play with dolphin,snorkelling...",
    about:"Meet the locals, watch fishing and seaweed farming, and learn about daily life on the coast.",
    inc:["Village guide","Transport"],exc:["Meals"]},

    nakupenda:{title:"Nakupenda Tour",url:"nakupenda.html",img:"images/nakupenda.jpg",date:"March 25, 2020",time:"Half day",
    short:"Visit the beautiful Nakupenda sandbank, a white sand island in the middle of the turquoise ocean.",
    about:"Take a boat to Nakupenda sandbank, swim in crystal clear water, relax on the white sand and enjoy a fresh seafood lunch.",
    inc:["Boat","Seafood lunch","Snorkeling gear"],exc:["Drinks"]},

  prison:{title:"Prison Island Tour",url:"prison-island.html",img:"images/prison-island.jpg",date:"March 25, 2020",time:"Half day",
    short:"Meet the giant tortoises and snorkel at Prison Island.",
    about:"Enjoy a short boat ride to Prison Island, meet the giant tortoises, explore the old prison ruins and swim or snorkel in clear water.",
    inc:["Boat","Guide","Snorkeling gear"],exc:["Entrance fee"]},

  jetski:{title:"Jetski Tour",url:"Jetski.html",img:"images/jetski-1.jpg",date:"March 25, 2020",time:"1-2 hours",
    short:"Ride a jetski on the Indian Ocean.",
    about:"Enjoy fast and exciting jetski rides on the ocean with safety equipment and a trained instructor.",
    inc:["Jetski","Life jacket","Instructor"],exc:["Drinks"]},

  baraka:{title:"Baraka Aquarium Tour",url:"index-4.html",img:"images/baraka-aquarium.jpg",date:"March 25, 2020",time:"Half day",
    short:"Swim and snorkel with friendly sea creatures at Baraka Natural Aquarium.",
    about:"Visit Baraka Natural Aquarium, a calm natural lagoon where you can see colorful fish, turtles and other marine life up close and enjoy snorkeling in safe, clear water.",
    inc:["Transport","Guide","Snorkeling gear"],exc:["Entrance fee","Meals and drinks"]},

  jetcar:{title:"Jet Car Tour",url:"jet-car.html",img:"images/Jetcar-2.jpg",date:"March 25, 2020",time:"1-2 hours",
    short:"Fast and fun jet car ride on the Indian Ocean.",
    about:"Feel the speed and excitement of a jet car on the ocean with safety equipment and an experienced instructor, perfect for friends, couples and families.",
    inc:["Jet car","Life jacket","Instructor"],exc:["Drinks"]},

    kayak :{title:"Clearkayak Sports Tour",url:"kayak.html",img:"images/Clearkayak-1.jpg",date:"March 25, 2025",time:"4-5 Hours",
    short:"Clearkayak is one of the most popular water sports in Zanzibar,primarly around the island's pristine northerrn beaches around Nungwi and Kendwa beaches where the water conditions are ideal.Rentals and Guided .....",
    inc:["Airport transfers","Accommodation","Breakfast","Guide","Tours as per itinerary"],exc:["Flights","Lunch and dinner","Drinks","Personal expenses"]}
};

const $ = id => document.getElementById(id);
const pic = t => `<img src="${t.img}" alt="${t.title}" onerror="this.remove()">`;

$("waFloat").href = `https://wa.me/${WHATSAPP}`;
$("burger").onclick = () => $("menu").classList.toggle("open");

function renderList(){
  $("list").innerHTML = Object.entries(TOURS).map(([k,t])=>`
    <a class="item" href="${t.url || '#' + k}">
      <div class="thumb">${pic(t)}</div>
      <div class="txt"><h2>${t.title}</h2>
        <div class="date">${t.date}</div>
        <p>${t.short}</p></div>
    </a>`).join("");
}


function renderDetail(k){
  const t = TOURS[k];
  $("detail").innerHTML = `
    <a class="back" href="#">&larr; Back to Destinations</a>
    <div class="hero">${pic(t)}</div>
    <h2>${t.title}</h2>
    <div class="facts"><span>${t.time}</span><span>From ${t.from} per person</span></div>
    <p>${t.about}</p>
    <h3>Included</h3><ul>${t.inc.map(i=>`<li>${i}</li>`).join("")}</ul>
    <h3>Not included</h3><ul>${t.exc.map(i=>`<li>${i}</li>`).join("")}</ul>
    <form class="book" id="book" onsubmit="return false">
      <h3>Book: ${t.title}</h3>
      <div class="grid">
        <div><label>Full name</label><input id="f_name" required></div>
        <div><label>Email</label><input id="f_mail" type="email"></div>
        <div><label>Phone / WhatsApp</label><input id="f_tel"></div>
        <div><label>Date</label><input id="f_date" type="date"></div>
        <div><label>Adults</label><input id="f_ad" type="number" min="1" value="2"></div>
        <div><label>Children</label><input id="f_ch" type="number" min="0" value="0"></div>
        <div class="full"><label>Message</label><textarea id="f_msg" rows="3"></textarea></div>
      </div>
      <div class="send">
        <button class="wa" onclick="sendBooking('${k}','wa')">Send via WhatsApp</button>
        <button class="em" onclick="sendBooking('${k}','mail')">Send via Email</button>
      </div>
    </form>`;
}

function sendBooking(k,via){
  const v = id => $(id).value.trim();
  if(!v("f_name")){ $("f_name").focus(); return; }
  const text = `Booking: ${TOURS[k].title}\nName: ${v("f_name")}\nEmail: ${v("f_mail")}\nPhone: ${v("f_tel")}\nDate: ${v("f_date")}\nAdults: ${v("f_ad")}\nChildren: ${v("f_ch")}\nMessage: ${v("f_msg")}`;
  if(via==="wa") window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,"_blank");
  else location.href = `mailto:${EMAIL}?subject=${encodeURIComponent("Booking: "+TOURS[k].title)}&body=${encodeURIComponent(text)}`;
}

function route(){
  const k = location.hash.slice(1);
  const isTour = TOURS[k];
  $("list").classList.toggle("on", !isTour);
  $("detail").classList.toggle("on", !!isTour);
  $("title").textContent = isTour ? TOURS[k].title : "Destinations Zanzibar";
  $("crumb").innerHTML = isTour ? ` / <a href="#">Zanzibar</a> / ${TOURS[k].title}` : "";
  $("menu").classList.remove("open");
  if(isTour) renderDetail(k);
  window.scrollTo(0,0);
}
renderList();
window.addEventListener("hashchange",route);
route();
</script>
<script src="social.js"></script>
</body>
