const $ = id => document.getElementById(id);
const pic = t => `<img src="${t.img}" alt="${t.title}" onerror="this.remove()">`;

$("waFloat").href = `https://wa.me/${WHATSAPP}`;
$("burger").onclick = () => $("menu").classList.toggle("open");

function renderList(){
  $("list").innerHTML = Object.entries(TOURS).map(([k,t])=>`
    <a class="item" href="${t.url || '#' + k}">
      <div class="thumb">${pic(t)}</div>
      <div class="txt"><h2>${t.title}</h2>
        <div class="date">${t.date}</div>
        <p>${t.short}</p></div>
    </a>`).join("");
}


function renderDetail(k){
  const t = TOURS[k];
  $("detail").innerHTML = `
    <a class="back" href="#">&larr; Back to Destinations</a>
    <div class="hero">${pic(t)}</div>
    <h2>${t.title}</h2>
    <div class="facts"><span>${t.time}</span><span>From ${t.from} per person</span></div>
    <p>${t.about}</p>
    <h3>Included</h3><ul>${t.inc.map(i=>`<li>${i}</li>`).join("")}</ul>
    <h3>Not included</h3><ul>${t.exc.map(i=>`<li>${i}</li>`).join("")}</ul>
    <form class="book" id="book" onsubmit="return false">
      <h3>Book: ${t.title}</h3>
      <div class="grid">
        <div><label>Full name</label><input id="f_name" required></div>
        <div><label>Email</label><input id="f_mail" type="email"></div>
        <div><label>Phone / WhatsApp</label><input id="f_tel"></div>
        <div><label>Date</label><input id="f_date" type="date"></div>
        <div><label>Adults</label><input id="f_ad" type="number" min="1" value="2"></div>
        <div><label>Children</label><input id="f_ch" type="number" min="0" value="0"></div>
        <div class="full"><label>Message</label><textarea id="f_msg" rows="3"></textarea></div>
      </div>
      <div class="send">
        <button class="wa" onclick="sendBooking('${k}','wa')">Send via WhatsApp</button>
        <button class="em" onclick="sendBooking('${k}','mail')">Send via Email</button>
      </div>
    </form>`;
}

function sendBooking(k,via){
  const v = id => $(id).value.trim();
  if(!v("f_name")){ $("f_name").focus(); return; }
  const text = `Booking: ${TOURS[k].title}\nName: ${v("f_name")}\nEmail: ${v("f_mail")}\nPhone: ${v("f_tel")}\nDate: ${v("f_date")}\nAdults: ${v("f_ad")}\nChildren: ${v("f_ch")}\nMessage: ${v("f_msg")}`;
  if(via==="wa") window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`,"_blank");
  else location.href = `mailto:${EMAIL}?subject=${encodeURIComponent("Booking: "+TOURS[k].title)}&body=${encodeURIComponent(text)}`;
}

function route(){
  const k = location.hash.slice(1);
  const isTour = TOURS[k];
  $("list").classList.toggle("on", !isTour);
  $("detail").classList.toggle("on", !!isTour);
  $("title").textContent = isTour ? TOURS[k].title : "Destinations Zanzibar";
  $("crumb").innerHTML = isTour ? ` / <a href="#">Zanzibar</a> / ${TOURS[k].title}` : "";
  $("menu").classList.remove("open");
  if(isTour) renderDetail(k);
  window.scrollTo(0,0);
}
renderList();
window.addEventListener("hashchange",route);
route();
</script>
